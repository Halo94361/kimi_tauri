name: release

# Gitea 侧的自动发布：本机 runner 是 host 模式（label `host`），没有 GitHub
# Actions 市场可用，因此 checkout、打包、发布全部手写命令，不写 `uses:`。
# 推 `v*` 标签：交叉编译 Windows 产物并创建 Release；手动触发：只编译打包，
# 产物留在 runner 工作目录，用于验证工具链。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: host
    steps:
      - name: checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git -c http.extraheader="Authorization: token $TOKEN" fetch --depth 1 origin "${{ github.ref }}"
          git checkout -q FETCH_HEAD

      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          set -eu
          # runner 的 PATH 不含 rustup 目录，cargo/rustup 手动补上
          export PATH="$HOME/.cargo/bin:$HOME/.local/share/mise/shims:$HOME/.local/bin:$PATH"
          rustup target add x86_64-pc-windows-gnu

          # Go sidecar：与 exe 同目录分发
          cd sidecar/opencode-session-proxy
          go build -trimpath -buildvcs=false -ldflags="-s -w" -o opencode-session-proxy.exe .

          # Linux runner 上直接交叉编译 GNU target；宿主 mingw-w64 自带
          # libgcc_eh.a，不需要 link-libs 覆盖，也不依赖 Windows SDK。
          # 全量构建偶发 rustc fat LTO 报 "Invalid bitcode signature"，重跑即过；
          # 发布不能因这种链接期抖动中断，最多重试 3 次
          cd ../../src-tauri
          for attempt in 1 2 3; do
            if cargo build --release --target x86_64-pc-windows-gnu; then
              break
            fi
            [ "$attempt" = 3 ] && exit 1
            echo "第 $attempt 次构建失败，重试"
          done

      - name: package
        run: |
          set -eu
          TARGET=src-tauri/target/x86_64-pc-windows-gnu/release
          mkdir -p dist
          # exe 动态依赖 WebView2Loader.dll，必须同目录；sidecar 亦同目录
          cp "$TARGET/tauri_kimi.exe" "$TARGET/WebView2Loader.dll" \
             sidecar/opencode-session-proxy/opencode-session-proxy.exe dist/
          (cd dist && zip -qr tauri_kimi-windows-x64.zip \
             tauri_kimi.exe WebView2Loader.dll opencode-session-proxy.exe \
             && sha256sum tauri_kimi-windows-x64.zip > sha256sums.txt)
          ls -l dist

      - name: publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          API="${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          AUTH="Authorization: token $TOKEN"
          BODY=$(printf 'Automated release for %s.\n\nWindows x64 build cross-compiled on Linux (x86_64-pc-windows-gnu): tauri_kimi.exe + WebView2Loader.dll + opencode-session-proxy.exe.\nBuild: %s.' "$VERSION" "$(git rev-parse --short HEAD)")
          payload=$(VERSION="$VERSION" BODY="$BODY" python3 -c 'import json,os;print(json.dumps({"tag_name":os.environ["VERSION"],"name":os.environ["VERSION"],"body":os.environ["BODY"],"draft":False,"prerelease":False}))')
          create=$(curl -sS -o /tmp/rel.json -w '%{http_code}' -X POST \
            -H "$AUTH" -H "Content-Type: application/json" \
            -d "$payload" \
            "$API/releases")
          if [ "$create" = "201" ]; then
            id=$(python3 -c 'import json;print(json.load(open("/tmp/rel.json"))["id"])')
          else
            # 同标签重跑：复用已有 Release 并清空旧附件，避免重复
            id=$(curl -sS -H "$AUTH" "$API/releases/tags/$VERSION" | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
            for asset in $(curl -sS -H "$AUTH" "$API/releases/$id/assets" | python3 -c 'import sys,json;[print(a["id"]) for a in json.load(sys.stdin)]'); do
              curl -sS -o /dev/null -X DELETE -H "$AUTH" "$API/releases/$id/assets/$asset"
            done
          fi
          for f in dist/tauri_kimi-windows-x64.zip dist/sha256sums.txt; do
            name=$(basename "$f")
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "$AUTH" \
              -F "attachment=@$f" "$API/releases/$id/assets?name=$name")
            echo "upload $name -> $code"
            [ "$code" = "201" ] || exit 1
          done
          echo "release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$VERSION"
