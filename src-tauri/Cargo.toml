[package]
name = "tauri_kimi"
version = "0.1.0"
edition = "2021"

[lib]
name = "tauri_kimi_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
regex = "1"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
