[package]
name = "tauri_kimi"
version = "0.2.0"
edition = "2021"

[lib]
name = "tauri_kimi_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable feature：解锁多 WebView 所需的 WebviewBuilder / WindowBuilder /
# Window::add_child / Manager::get_webview 等 API
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-opener = "2"
regex = "1"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
