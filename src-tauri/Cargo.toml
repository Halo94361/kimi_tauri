[package]
name = "tauri_kimi"
version = "0.7.3"
edition = "2021"

[lib]
name = "tauri_kimi_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable feature：解锁多 WebView 所需的 WebviewBuilder / WindowBuilder /
# Window::add_child / Manager::get_webview 等 API
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-opener = "2"
# 额度查询：Kimi 官方 usages API。native-tls 在 Windows 走 schannel，
# 不引入 OpenSSL 运行时依赖；blocking 版本由 spawn_blocking 包裹，不占主线程
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "native-tls",
] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 读 CLI 的 config.toml，取 OpenCode Go provider 的 api_key（直连额度接口，免起 seekfetch）
toml = "0.8"
# std 无法获取本地时区；用量统计按本地日期分桶需要 epoch 毫秒 → 本地日期换算
time = { version = "0.3", features = ["local-offset"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
