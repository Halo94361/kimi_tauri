<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Kimi Code</title>
  <style>
    /* 更纱黑体等宽子集：随 ui 目录一起打进二进制，不依赖系统是否安装字体 */
    @font-face {
      font-family: "SarasaMonoSC";
      src: url("fonts/SarasaMonoSC-UI.woff2") format("woff2");
      font-weight: normal;
      font-style: normal;
      font-display: block;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #1a1a1e;
      color: #d4d4d8;
      font-family: "SarasaMonoSC", "Sarasa Mono SC", "Segoe UI", "Microsoft YaHei", "Segoe UI Emoji", sans-serif;
      user-select: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box { text-align: center; }
    .spinner {
      width: 36px;
      height: 36px;
      margin: 0 auto 16px;
      border: 3px solid #3f3f46;
      border-top-color: #1a88ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg { font-size: 14px; color: #a1a1aa; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <div class="msg">正在启动 Kimi Code 服务…</div>
  </div>
  <script>
    // 初始化脚本已写入有效主题；事件到达前不再按系统主题反复跳变
    (function () {
      function apply(theme) {
        var current = theme || document.documentElement.dataset.theme;
        var dark = current ? current !== "light" : !matchMedia("(prefers-color-scheme: light)").matches;
        var bg = dark ? "#1a1a1e" : "#ffffff";
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.background = bg;
        document.body.style.background = bg;
        document.body.style.color = dark ? "#d4d4d8" : "#111827";
        var hint = document.querySelector(".msg");
        if (hint) hint.style.color = dark ? "#a1a1aa" : "#6b7280";
      }
      apply(null);
      // 监听就绪后补取一次，避免启动时的首次广播丢失
      window.__TAURI__.event.listen("theme-changed", function (e) { apply(e.payload); })
        .then(function () { return window.__TAURI__.core.invoke("sync_theme"); })
        .catch(function () {});
    })();
  </script>
</body>
</html>
