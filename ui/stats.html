<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 视觉语言与图表技法参考 kimi-code-monitor (MIT)：https://github.com/bfjnbvf/kimi-code-monitor -->
  <title>Kimi Code - 用量统计</title>
  <style>
    /* 更纱黑体等宽子集：与其它自绘页面共用，覆盖 ASCII + 中文常用字。
       标签用系统无衬线，数字单独用等宽——仪表盘的字重对比主要来自这里 */
    @font-face {
      font-family: "SarasaMonoSC";
      src: url("fonts/SarasaMonoSC-UI.woff2") format("woff2");
      font-weight: normal;
      font-style: normal;
      font-display: block;
    }
    /* 浮窗整页走 SemiBold：100% 缩放下 Regular 的中文竖笔只有 0.77 设备像素，
       抗锯齿后是一根灰线；同字号 SemiBold 是 0.97px，正好压住一个整像素 */
    @font-face {
      font-family: "SarasaMonoSC";
      src: url("fonts/SarasaMonoSC-UI-Semibold.woff2") format("woff2");
      font-weight: 600;
      font-style: normal;
      font-display: block;
    }
    /* 独立子 WebView：宽度固定，高度随内容变化由 Rust 调整；
       页面底色取内容页采样色，保证圆角外沿与背后页面一致。
       内部一律用半透明填充，落在任何采样底色上都自然 */
    :root {
      color-scheme: dark;
      --page-bg: #1a1a1e;
      --panel: rgba(30, 30, 34, 0.94);
      --text: rgba(255, 255, 255, 0.88);
      --text-2: rgba(255, 255, 255, 0.56);
      --text-3: rgba(255, 255, 255, 0.38);
      --fill-1: rgba(255, 255, 255, 0.05);
      --fill-2: rgba(255, 255, 255, 0.09);
      --fill-2-hover: rgba(255, 255, 255, 0.14);
      --border: rgba(255, 255, 255, 0.12);
      --divider: rgba(255, 255, 255, 0.08);
      --accent: #1a88ff;
      --green: #16c456;
      --oc-dot: #ff6b9d;
      --orange: #ff9f0a;
      --danger: #ff4756;
      --tabbar-bg: #1a1a1e;
      --sans: "SarasaMonoSC", "Sarasa Mono SC", ui-monospace, "SF Mono", Menlo,
        Consolas, monospace;
      --mono: "SarasaMonoSC", "Sarasa Mono SC", ui-monospace, "SF Mono", Menlo,
        Consolas, monospace;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --page-bg: #ffffff;
      --panel: rgba(255, 255, 255, 0.94);
      --text: rgba(0, 0, 0, 0.86);
      --text-2: rgba(0, 0, 0, 0.55);
      --text-3: rgba(0, 0, 0, 0.38);
      --fill-1: rgba(0, 0, 0, 0.035);
      --fill-2: rgba(0, 0, 0, 0.06);
      --fill-2-hover: rgba(0, 0, 0, 0.1);
      --border: rgba(0, 0, 0, 0.12);
      --divider: rgba(0, 0, 0, 0.07);
      --accent: #1783ff;
      --green: #0fae4a;
      --oc-dot: #d94f8a;
      --orange: #f08a00;
      --danger: #e5374a;
      --tabbar-bg: #ffffff;
    }
    html, body {
      margin: 0;
      overflow: hidden;
      background: var(--page-bg);
      color: var(--text);
      /* 600：本页 @font-face 注册了 SemiBold 字面，整页统一走它 */
      font: 600 13px/1.5 var(--sans);
      user-select: none;
      -webkit-user-select: none;
    }
    .num {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
    }
    #root {
      position: relative;
      width: 300px;
      touch-action: none;
    }
    #bar {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 30px;
      box-sizing: border-box;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      white-space: nowrap;
      cursor: move;
    }
    #barText {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 12px;
      color: var(--text-2);
    }
    #barText .num { color: var(--text); }
    body.docked #bar {
      height: 36px;
      padding: 0 8px;
      border: 0;
      border-left: 1px solid var(--divider);
      border-bottom: 1px solid var(--divider);
      border-radius: 0;
      background: var(--tabbar-bg);
    }
    #dot {
      display: none;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      box-sizing: border-box;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--panel);
      font-size: 16px;
      cursor: move;
    }
    body.folded #bar { display: none; }
    body.folded #dot { display: flex; }
    /* 吸附态折叠成圆点时，底色应与选项卡栏一致，而不是内容页 */
    body.docked.folded { background: var(--tabbar-bg); }

    #detail {
      display: none;
      box-sizing: border-box;
      width: 300px;
      margin-top: 6px;
      padding: 10px 12px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      overflow-y: auto;
      cursor: default;
    }
    .detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .detail-head > span:first-child {
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--text-3);
    }
    #pin {
      cursor: pointer;
      opacity: 0.35;
      font-size: 12px;
      transition: opacity 120ms ease;
    }
    #pin:hover { opacity: 1; }

    .section {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin: 10px 0 5px;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--text-3);
      white-space: nowrap;
    }
    .section:first-child { margin-top: 0; }
    .section .note {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }

    .card {
      padding: 8px 9px 9px;
      border-radius: 9px;
      background: var(--fill-1);
    }
    .plan + .plan { margin-top: 2px; }
    .plan-head {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 6px;
    }
    .plan-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.01em;
    }
    .plan-sub {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-3);
      white-space: nowrap;
    }
    .brand-dot {
      flex-shrink: 0;
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .brand-dot.kimi { background: var(--accent); }
    .brand-dot.oc { background: var(--oc-dot); }
    .divider {
      height: 1px;
      margin: 8px 0 7px;
      background: var(--divider);
    }

    .quota + .quota { margin-top: 6px; }
    .quota-head {
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
    }
    .quota-label {
      font-size: 11px;
      color: var(--text-2);
      white-space: nowrap;
    }
    .quota-reset {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .quota-pct {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .quota-pct.mid { color: var(--orange); }
    .quota-pct.high { color: var(--danger); }
    .track {
      position: relative;
      height: 4px;
      margin-top: 3px;
      border-radius: 100px;
      background: var(--fill-2);
      overflow: visible;
    }
    .fill {
      display: block;
      height: 100%;
      border-radius: 100px;
      background: var(--green);
      transition:
        width 300ms cubic-bezier(0.23, 1, 0.32, 1),
        background-color 200ms ease;
    }
    .fill.mid { background: var(--orange); }
    .fill.high { background: var(--danger); }
    /* 匀速参照：按窗口已流逝比例定位，上下各凸出 2px，压在填充之上 */
    .pace {
      position: absolute;
      top: -2px;
      bottom: -2px;
      z-index: 2;
      width: 2px;
      margin-left: -1px;
      border-radius: 1px;
      /* 线压在使用量填充之上：颜色必须比填充更实，否则落在绿条里的线会看不见 */
      background: var(--text-2);
      transition: left 300ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    .hint {
      display: flex;
      align-items: center;
      min-height: 26px;
      padding: 5px 8px;
      border: 1px dashed var(--border);
      border-radius: 7px;
      color: var(--text-3);
      font-size: 11px;
      line-height: 1.4;
    }
    .empty {
      padding: 6px 0;
      color: var(--text-3);
      font-size: 11px;
    }

    .chart {
      display: flex;
      align-items: flex-end;
      gap: 1px;
      height: 32px;
      margin-top: 4px;
    }
    .chart-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 100%;
      min-width: 0;
    }
    .chart-bar {
      width: 100%;
      min-height: 0;
      border-radius: 1px 1px 0 0;
      background: var(--accent);
      opacity: 0.55;
      transition: opacity 120ms ease;
    }
    .chart-bar.sub {
      background: var(--green);
      opacity: 0.8;
    }
    .chart-bar.flat { border-radius: 0; }
    .chart-col:hover .chart-bar { opacity: 1; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px 12px;
    }
    .cell {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px;
      min-width: 0;
    }
    .cell .k {
      flex-shrink: 0;
      font-size: 11px;
      color: var(--text-3);
      white-space: nowrap;
    }
    .cell .v {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-2);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    @media (prefers-reduced-motion: reduce) {
      .fill, .pace, .chart-bar, #pin { transition: none; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="bar"><span id="barText"></span></div>
    <div id="dot">⚡</div>
    <div id="detail">
      <div class="detail-head"><span>用量与额度</span><span id="pin" title="锁定 / 自动收起">📌</span></div>
      <div id="detailBody"></div>
    </div>
  </div>
  <script>
    (function () {
      const invoke = window.__TAURI__.core.invoke;
      const listen = window.__TAURI__.event.listen;
      const POS_KEY = "kimiStatsGeom2", FOLD_KEY = "kimiStatsFold2", PIN_KEY = "kimiStatsPin2";
      const FULL_W = 300, BAR_H = 30, DOCK_H = 36, FOLDED = 36;

      const root = document.getElementById("root");
      const bar = document.getElementById("bar");
      const barText = document.getElementById("barText");
      const dot = document.getElementById("dot");
      const detail = document.getElementById("detail");
      const detailBody = document.getElementById("detailBody");
      const pinBtn = document.getElementById("pin");

      let docked = false;
      let folded = localStorage.getItem(FOLD_KEY) === "1";
      let pinned = localStorage.getItem(PIN_KEY) === "1";
      let dragging = false;
      let visible = false;
      let open = false;
      let lastData = null, lastDaily = null, lastHourly = null, lastQuota = null;
      // 设置里的展示开关与额度轮询周期：默认全开、120s，get_settings 返回后校正
      let statsPrefs = { usage: true, kimi: true, opencode: true, refreshMs: 120000 };
      let quotaTimer = 0;
      let lastW = 0, lastH = 0;
      let appliedH = 0;
      let sizePending = false;

      function usageEnabled() {
        return statsPrefs.usage;
      }

      function quotaEnabled() {
        return statsPrefs.kimi || statsPrefs.opencode;
      }

      function hasUsageData() {
        return statsPrefs.usage && (
          (lastData && lastData.found) || (lastDaily && lastDaily.found)
        );
      }

      function hasQuota(q) {
        if (!quotaEnabled()) return false;
        return !!q && (
          (statsPrefs.kimi && q.kimi && q.kimi.ok) ||
          (statsPrefs.opencode && q.opencode && q.opencode.ok)
        );
      }

      function onKimiData() {
        return hasUsageData() || hasQuota(lastQuota);
      }

      function setVisible(v) {
        if (visible === v) return;
        visible = v;
        invoke("stats_set_visible", { visible: v }).catch(function () {});
      }

      /* 内容尺寸上报：宽度固定，高度按「横条 + 6px 间距 + 明细」自然高度计算；
         测量前先解除 max-height 约束，避免窗口变矮后越测越小 */
      function requestSize(force) {
        if (dragging || sizePending) return;
        sizePending = true;
        requestAnimationFrame(function () {
          sizePending = false;
          if (dragging) return;
          detail.style.maxHeight = "";
          var w = folded ? FOLDED : FULL_W;
          var h = Math.ceil(root.getBoundingClientRect().height);
          if (!force && w === lastW && h === lastH) return;
          lastW = w; lastH = h;
          invoke("stats_set_size", { width: w, height: h }).catch(function () {});
        });
      }

      function setOpen(v) {
        open = !!(v && onKimiData() && !folded);
        detail.style.display = open ? "block" : "none";
        if (!open) detail.style.maxHeight = "";
        requestSize();
      }

      function applyPin() {
        pinBtn.style.opacity = pinned ? "1" : "0.35";
        if (pinned) setOpen(true);
      }

      function applyFold() {
        document.body.classList.toggle("folded", folded);
        localStorage.setItem(FOLD_KEY, folded ? "1" : "0");
        if (folded) {
          open = false;
          detail.style.display = "none";
        } else if (pinned) {
          setOpen(true);
        }
        requestSize();
      }

      function toggleFold() {
        folded = !folded;
        applyFold();
      }

      /* ---------- 拖动：只上报 pointerdown，实际移动由 Rust 轮询光标完成 ---------- */
      function bindDrag(el) {
        el.addEventListener("pointerdown", function (e) {
          if (e.button !== 0) return;
          dragging = true;
          setOpen(false);
          invoke("stats_drag_start").catch(function () {});
        });
      }
      bindDrag(bar);
      bindDrag(dot);

      document.addEventListener("pointerup", function () {
        if (dragging) {
          dragging = false;
          requestSize();
        }
        // 点击统计浮窗会夺走焦点，交互结束后还给内容页，保证可直接继续输入
        setTimeout(function () {
          invoke("stats_focus_content").catch(function () {});
        }, 0);
      });

      document.addEventListener("dblclick", function (e) {
        if (dragging || detail.contains(e.target) || pinBtn.contains(e.target)) return;
        toggleFold();
      });

      pinBtn.addEventListener("click", function () {
        pinned = !pinned;
        localStorage.setItem(PIN_KEY, pinned ? "1" : "0");
        applyPin();
      });

      /* 从 30/36px 横条展开时，WebView 变高需要一次 IPC + 原生 resize，
         期间指针可能短暂离开原区域；给收起留一点宽限，避免展开失败 */
      var closeTimer = 0;
      root.addEventListener("mouseenter", function () {
        clearTimeout(closeTimer);
        if (!dragging && !folded && onKimiData()) setOpen(true);
      });
      root.addEventListener("mouseleave", function () {
        if (pinned || dragging) return;
        clearTimeout(closeTimer);
        closeTimer = setTimeout(function () { setOpen(false); }, 160);
      });

      /* ---------- 格式化 ---------- */
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function fmt(n) {
        n = Number(n) || 0;
        if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
        if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
        if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
        return String(Math.round(n));
      }
      function pctText(p) {
        if (p == null || !isFinite(p)) return "--";
        var n = Number(p);
        return (n >= 10 ? Math.round(n) : Math.round(n * 10) / 10) + "%";
      }
      function pctClass(p) {
        if (p == null) return "";
        return p >= 95 ? "high" : p >= 80 ? "mid" : "";
      }
      function pad2(n) {
        return n < 10 ? "0" + n : String(n);
      }
      function fmtReset(ms) {
        if (!ms) return "";
        var diff = ms - Date.now();
        if (diff <= 0) return "即将重置";
        var min = Math.floor(diff / 60000);
        if (min < 60) return min + "m";
        var h = Math.floor(min / 60);
        if (h < 24) return h + "h" + (min % 60 ? (min % 60) + "m" : "");
        var d = Math.floor(h / 24);
        return d + "d" + (h % 24 ? (h % 24) + "h" : "");
      }
      function fmtAbs(ms) {
        if (!ms) return "";
        return new Date(ms).toLocaleString("zh-CN", {
          month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"
        });
      }
      /* 匀速参照：窗口已流逝比例；重置时间缺失或剩余超过整个窗口时不画 */
      function paceLeft(q) {
        if (!q || !q.reset_at || !q.window_ms) return null;
        var elapsed = 1 - (q.reset_at - Date.now()) / q.window_ms;
        if (!(elapsed >= 0 && elapsed <= 1)) return null;
        return elapsed * 100;
      }

      /* ---------- 明细渲染 ---------- */
      function section(label, note) {
        return '<div class="section"><span>' + label + "</span>" +
          (note ? '<span class="note">' + note + "</span>" : "") + "</div>";
      }
      /* OpenCode 的窗口上限不是独立额度：5h = 月额度 20%，本周 = 月额度 50%。
         参考线把「本月已用」折算到窗口刻度：15% 表示本月已用掉 15% 的 5h 上限。
         月额度缺失时不画线，避免退回按窗口时间独立计算 */
      function ocPace(data, share) {
        if (!data || !data.monthly || typeof data.monthly.used_pct !== "number") return null;
        var used = Math.max(0, Math.min(100, data.monthly.used_pct));
        return {
          pct: Math.max(0, Math.min(100, used / share)),
          title: "本月已用 " + pctText(used) + " 折算：该窗口上限为月额度的 " +
            Math.round(share * 100) + "%"
        };
      }
      /* Kimi 本周按整天步进，不看小时：周额度 7 天均分。
         剩余时间向下取整到天，当前第 N 天 = 7 - floor(剩余天数)，
         线 = N / 7，代表到当天结束为止的累计上限。
         例：剩 6d18h → 第 1 天 → 14.3%；剩 0d18h → 第 7 天 → 100% */
      function weekDayPace(q) {
        if (!q || !q.reset_at || !q.window_ms) return null;
        var dayMs = 24 * 60 * 60 * 1000;
        var remainingDays = Math.floor((q.reset_at - Date.now()) / dayMs);
        var dayIndex = Math.min(7, Math.max(1, 7 - remainingDays));
        var pct = (dayIndex / 7) * 100;
        return {
          pct: pct,
          title: "周额度按 7 天均分：第 " + dayIndex + " 天，累计上限 " +
            pct.toFixed(1) + "%"
        };
      }
      function quotaRow(label, q, pace) {
        if (!q || typeof q.used_pct !== "number") return "";
        var p = Math.max(0, Math.min(100, q.used_pct));
        var cls = pctClass(p);
        // undefined = 按窗口时间匀速；null = 不画；对象 = 调用方给的位置与说明
        var info = pace === undefined
          ? { pct: paceLeft(q), title: "按窗口时间均匀消耗的位置" }
          : pace;
        var reset = fmtReset(q.reset_at);
        return '<div class="quota">' +
          '<div class="quota-head">' +
            '<span class="quota-label">' + esc(label) + "</span>" +
            (reset ? '<span class="quota-reset" title="' + esc(fmtAbs(q.reset_at)) + '">' + esc(reset) + "</span>" : "") +
            '<span class="quota-pct ' + cls + '">' + pctText(p) + "</span>" +
          "</div>" +
          '<div class="track">' +
            '<span class="fill ' + cls + '" style="width:' + p.toFixed(1) + '%"></span>' +
            (info && info.pct != null
              ? '<span class="pace" style="left:' + info.pct.toFixed(1) + '%" title="' + esc(info.title) + '"></span>'
              : "") +
          "</div>" +
        "</div>";
      }
      function planBlock(kind, name, sub, data, rows) {
        var body = "";
        if (!data || data.disabled) {
          body = '<div class="hint">正在查询…</div>';
        } else if (!data.ok) {
          body = '<div class="hint">' + esc(data.error || "额度暂不可用") + "</div>";
        } else {
          for (var i = 0; i < rows.length; i += 1) {
            var row = rows[i];
            var pace = row[2] ? row[2](data) : undefined;
            body += quotaRow(row[0], data[row[1]], pace);
          }
          if (!body) body = '<div class="hint">暂无可显示的额度</div>';
        }
        return '<div class="plan">' +
          '<div class="plan-head"><span class="brand-dot ' + kind + '"></span>' +
          '<span class="plan-name">' + esc(name) + "</span>" +
          '<span class="plan-sub">' + esc(sub) + "</span></div>" +
          body + "</div>";
      }
      function cell(k, v) {
        return '<div class="cell"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v) + "</span></div>";
      }
      function grid(cells) {
        return '<div class="grid">' + cells.join("") + "</div>";
      }
      function chartBlock(h) {
        if (!h || !h.found || !h.hours) return "";
        var max = 0, total = 0;
        for (var i = 0; i < h.hours.length; i += 1) {
          max = Math.max(max, h.hours[i].main + h.hours[i].sub);
        }
        var cols = h.hours.map(function (b) {
          var main = Math.max(0, Number(b.main) || 0);
          var sub = Math.max(0, Number(b.sub) || 0);
          total += main + sub;
          var mp = max > 0 ? (main / max) * 100 : 0;
          var sp = max > 0 ? (sub / max) * 100 : 0;
          var hour = new Date(b.t).getHours();
          var title = pad2(hour) + ":00 · 主 " + fmt(main) + (sub > 0 ? " · 子 " + fmt(sub) : "");
          var inner = "";
          if (sub > 0) inner += '<span class="chart-bar sub" style="height:' + Math.max(4, sp).toFixed(1) + '%"></span>';
          if (main > 0) inner += '<span class="chart-bar' + (sub > 0 ? " flat" : "") + '" style="height:' + Math.max(4, mp).toFixed(1) + '%"></span>';
          return '<div class="chart-col" title="' + esc(title) + '">' + inner + "</div>";
        }).join("");
        var hit = h.cache_hit_rate != null ? " · 缓存 " + pctText(h.cache_hit_rate) : "";
        return section("近 24 小时" + hit, fmt(total)) + '<div class="chart">' + cols + "</div>";
      }

      function barValue(v) {
        return '<span class="num">' + esc(v) + "</span>";
      }

      function render() {
        var d = lastData, daily = lastDaily;
        var sFound = usageEnabled() && d && d.found;
        var dFound = usageEnabled() && daily && daily.found;
        var quota = lastQuota || {};
        var kimi = quota.kimi || null, oc = quota.opencode || null;
        if (!onKimiData()) {
          setVisible(false);
          return;
        }
        setVisible(true);

        /* 横条：优先实时 TPS，其次今日，最后额度摘要 */
        var barHtml = "";
        if (sFound) {
          barHtml = "⚡ " + barValue(d.has_tps ? d.tps_avg.toFixed(1) : "--") + " tok/s · ↑" +
            barValue(fmt(d.input_total)) + " · ↓" + barValue(fmt(d.output_total)) +
            " · 缓存 " + barValue(pctText(d.cache_hit_rate));
        } else if (dFound) {
          barHtml = "今日 ↑" + barValue(fmt(daily.input_total)) + " ↓" + barValue(fmt(daily.output_total)) +
            " · 缓存 " + barValue(pctText(daily.cache_hit_rate));
        } else if (statsPrefs.kimi && kimi && kimi.ok) {
          barHtml = "Kimi 5h " + barValue(pctText(kimi.five_hour && kimi.five_hour.used_pct)) +
            " · 本周 " + barValue(pctText(kimi.weekly && kimi.weekly.used_pct));
        } else if (statsPrefs.opencode && oc && oc.ok && oc.configured !== false) {
          barHtml = "OpenCode 5h " + barValue(pctText(oc.rolling && oc.rolling.used_pct)) +
            " · 本周 " + barValue(pctText(oc.weekly && oc.weekly.used_pct));
        }
        barText.innerHTML = barHtml;

        var html = "";
        var ocVisible = statsPrefs.opencode && !(oc && oc.configured === false);
        var plans = "";
        if (statsPrefs.kimi) {
          plans += planBlock("kimi", "Kimi Code", "5h · 本周", kimi, [
            ["5 小时", "five_hour"],
            ["本周", "weekly", function (d) { return weekDayPace(d.weekly); }]
          ]);
        }
        if (ocVisible) {
          if (plans) plans += '<div class="divider"></div>';
          plans += planBlock("oc", "OpenCode Go", "滚动 · 周 · 月", oc, [
            ["滚动 5h", "rolling", function (d) { return ocPace(d, 0.20); }],
            ["本周", "weekly", function (d) { return ocPace(d, 0.50); }],
            ["本月", "monthly"]
          ]);
        }
        if (plans) {
          var stale = (statsPrefs.kimi && kimi && kimi.stale) || (ocVisible && oc && oc.stale);
          var staleTitle = [
            statsPrefs.kimi && kimi && kimi.warning,
            ocVisible && oc && oc.warning
          ].filter(Boolean).join(" / ");
          html += '<div class="section"><span>套餐额度</span>' +
            (stale ? '<span class="note" title="' + esc(staleTitle) + '">缓存</span>' : "") + "</div>";
          html += '<div class="card">' + plans + "</div>";
        }

        if (usageEnabled() && lastHourly) {
          if (lastHourly.found) {
            html += chartBlock(lastHourly);
          } else {
            html += section("近 24 小时", "") + '<div class="empty">暂无数据</div>';
          }
        }

        if (sFound) {
          html += section("本会话", "");
          html += grid([
            cell("TPS 均值", d.has_tps ? d.tps_avg.toFixed(1) : "--"),
            cell("TPS 瞬时", d.has_tps ? d.tps_latest.toFixed(1) : "--"),
            cell("输入合计", fmt(d.input_total)),
            cell("输出合计", fmt(d.output_total)),
            cell("缓存命中", pctText(d.cache_hit_rate)),
            cell("缓存读", fmt(d.cache_read))
          ]);
        }

        if (usageEnabled()) {
          html += section("今日 · 全部会话", "");
          if (dFound) {
            html += grid([
              cell("输入合计", fmt(daily.input_total)),
              cell("输出合计", fmt(daily.output_total)),
              cell("缓存命中", pctText(daily.cache_hit_rate)),
              cell("缓存读", fmt(daily.cache_read))
            ]);
          } else {
            html += '<div class="empty">暂无数据</div>';
          }
        }

        detailBody.innerHTML = html;
        if (pinned) setOpen(true);
        requestSize();
      }

      /* ---------- 轮询 ---------- */
      function tickSession() {
        if (!usageEnabled()) return;
        invoke("session_stats")
          .then(function (d) { lastData = d; render(); })
          .catch(function () { lastData = null; render(); });
      }
      function tickDaily() {
        if (!usageEnabled()) return;
        invoke("daily_stats")
          .then(function (d) { lastDaily = d; render(); })
          .catch(function () { lastDaily = null; render(); });
      }
      function tickHourly() {
        if (!usageEnabled()) return;
        invoke("hourly_stats")
          .then(function (d) { lastHourly = d; render(); })
          .catch(function () { lastHourly = null; render(); });
      }
      function tickQuota() {
        if (!quotaEnabled()) {
          lastQuota = null;
          render();
          return;
        }
        invoke("quota_stats")
          .then(function (d) { lastQuota = d; render(); })
          .catch(function () { lastQuota = null; render(); });
      }

      /* ---------- 主题 ---------- */
      function applyTheme(p) {
        var current = p ? (p.dark === false ? "light" : "dark") : document.documentElement.dataset.theme;
        var dark = current !== "light";
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        var bg = (p && p.bg) || (dark ? "#1a1a1e" : "#ffffff");
        document.documentElement.style.setProperty("--page-bg", bg);
      }
      function applySettings(s) {
        if (!s) return;
        statsPrefs.usage = s.stats_show_usage !== false;
        statsPrefs.kimi = s.stats_quota_kimi !== false;
        statsPrefs.opencode = s.stats_quota_opencode !== false;
        var secs = Number(s.stats_quota_refresh_secs);
        statsPrefs.refreshMs = (isFinite(secs) && secs >= 30 ? Math.min(secs, 3600) : 120) * 1000;
      }
      function scheduleQuota() {
        if (quotaTimer) clearInterval(quotaTimer);
        quotaTimer = setInterval(tickQuota, statsPrefs.refreshMs);
      }
      applyTheme(null);
      // event.listen 是异步注册的；先收集 Promise，等全部注册完成再调
      // stats_restore，避免 Rust 立刻回发的主题/模式事件丢失
      var listens = [];
      listens.push(listen("page-theme", function (e) { applyTheme(e.payload); }));
      listens.push(listen("settings-changed", function (e) {
        // 设置页切换展示开关 / 刷新间隔：立即应用并重排定时器
        applySettings(e.payload);
        scheduleQuota();
        if (usageEnabled()) {
          tickSession();
          tickDaily();
          tickHourly();
        } else {
          lastData = null;
          lastDaily = null;
          lastHourly = null;
        }
        tickQuota();
        render();
      }));

      /* ---------- Rust 侧状态同步 ---------- */
      listens.push(listen("stats-mode", function (e) {
        docked = !!(e.payload && e.payload.docked);
        document.body.classList.toggle("docked", docked);
        if (!dragging) {
          open = false;
          detail.style.display = "none";
          requestSize();
        }
      }));
      listens.push(listen("stats-applied", function (e) {
        appliedH = (e.payload && e.payload.height) || 0;
        if (!open) {
          detail.style.maxHeight = "";
          return;
        }
        var head = docked ? DOCK_H : BAR_H;
        var avail = appliedH - head - 6;
        detail.style.maxHeight = Math.max(40, avail) + "px";
      }));
      listens.push(listen("stats-drop", function (e) {
        var p = e.payload || {};
        docked = !!p.docked;
        document.body.classList.toggle("docked", docked);
        localStorage.setItem(POS_KEY, JSON.stringify({ docked: docked, x: p.x, y: p.y }));
      }));
      listens.push(listen("stats-drag-end", function () {
        dragging = false;
        requestSize();
      }));
      listens.push(listen("stats-geom", function () {
        // 窗口尺寸变化后 Rust 会重新钳制高度，强制重报一次自然高度，
        // 窗口变回大尺寸时才能恢复展开面板
        requestSize(true);
      }));
      listens.push(listen("stats-reset", function () {
        // 设置页「恢复默认位置」：Rust 已复位几何，这里清掉页面持久化
        // 并恢复悬浮/展开显示（pin 保留，它不属于位置信息）
        localStorage.removeItem(POS_KEY);
        docked = false;
        folded = false;
        open = false;
        detail.style.display = "none";
        document.body.classList.remove("docked");
        applyFold();
      }));

      /* ---------- 启动：监听就绪后恢复几何，等首个数据到达再显示 ---------- */
      function restoreGeometry() {
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem(POS_KEY) || "null"); } catch (e) {}
        docked = !!(saved && saved.docked);
        document.body.classList.toggle("docked", docked);
        document.body.classList.toggle("folded", folded);
        invoke("stats_restore", {
          docked: docked,
          folded: folded,
          x: saved && typeof saved.x === "number" ? saved.x : null,
          y: saved && typeof saved.y === "number" ? saved.y : null
        }).catch(function () {});
      }
      Promise.all(listens).catch(function () {}).then(function () {
        restoreGeometry();
        // 先读设置：关闭的来源不发请求，额度按配置的间隔轮询
        invoke("get_settings")
          .then(function (s) { applySettings(s); })
          .catch(function () {})
          .then(function () {
            tickSession();
            tickDaily();
            tickHourly();
            tickQuota();
            scheduleQuota();
            setInterval(tickSession, 2000);
            setInterval(tickDaily, 10000);
            setInterval(tickHourly, 30000);
          });
      });
    })();
  </script>
</body>
</html>
