<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Kimi Code - 选项卡</title>
  <style>
    /* 更纱黑体等宽子集：随 ui 目录一起打进二进制，不依赖系统是否安装字体 */
    @font-face {
      font-family: "SarasaMonoSC";
      src: url("fonts/SarasaMonoSC-UI.woff2") format("woff2");
      font-weight: normal;
      font-style: normal;
      font-display: block;
    }
    /* 深浅色双主题：默认深色，prefers-color-scheme: light 切浅色（首报前的兜底）；
       收到 Rust 转发的页面主题采样结果后由 data-theme 属性精确覆盖 */
    :root {
      --bg: #1a1a1e;
      --fg: #a1a1aa;
      --fg-hover: #d4d4d8;
      --fg-active: #ffffff;
      --divider: rgba(255, 255, 255, 0.08);
      /* Kimi 品牌蓝（深色主题） */
      --accent: #1a88ff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --fg: #6b7280;
        --fg-hover: #374151;
        --fg-active: #111827;
        --divider: rgba(0, 0, 0, 0.08);
        --accent: #1783ff;
      }
    }
    :root[data-theme="dark"] {
      --bg: #1a1a1e;
      --fg: #a1a1aa;
      --fg-hover: #d4d4d8;
      --fg-active: #ffffff;
      --divider: rgba(255, 255, 255, 0.08);
      --accent: #1a88ff;
    }
    :root[data-theme="light"] {
      --bg: #ffffff;
      --fg: #6b7280;
      --fg-hover: #374151;
      --fg-active: #111827;
      --divider: rgba(0, 0, 0, 0.08);
      --accent: #1783ff;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: "SarasaMonoSC", "Sarasa Mono SC", "Segoe UI", "Microsoft YaHei", "Segoe UI Emoji", sans-serif;
      user-select: none;
    }
    .bar {
      display: flex;
      align-items: stretch;
      height: 100%;
      padding: 0 8px;
      box-sizing: border-box;
      border-bottom: 1px solid var(--divider);
    }
    .tab {
      display: flex;
      align-items: center;
      padding: 0 18px;
      font-size: 13px;
      color: var(--fg);
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .tab:hover { color: var(--fg-hover); }
    .tab.active {
      color: var(--fg-active);
      border-bottom-color: var(--accent);
    }
    .tab[hidden] { display: none; }
    /* 选项卡栏状态提示条（远程控制 / OpenCode 代理）：失败时给重试按钮 */
    .remote-chip,
    .proxy-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      align-self: center;
      min-width: 0;
      /* 紧贴选项卡左侧；宽度上限保证最小窗宽下也不会碰到右侧吸附的统计浮窗 */
      max-width: 220px;
      height: 24px;
      margin-left: 12px;
      padding: 0 4px 0 10px;
      box-sizing: border-box;
      border: 1px solid var(--divider);
      border-radius: 12px;
      font-size: 12px;
      color: var(--fg);
      overflow: hidden;
    }
    .remote-chip[hidden],
    .proxy-chip[hidden] { display: none; }
    .remote-chip.connecting { opacity: 0.7; }
    .remote-chip.failed,
    .proxy-chip.failed { color: var(--fg-hover); }
    .remote-text {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .remote-retry {
      flex: none;
      height: 22px;
      padding: 0 9px;
      border: none;
      border-radius: 11px;
      background: var(--accent);
      color: #fff;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .remote-retry[hidden] { display: none; }
    .remote-retry:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <div class="bar">
    <div class="tab active" data-tab="local">本地</div>
    <div class="tab" data-tab="remote">远端</div>
    <div class="tab" data-tab="settings">设置</div>
    <div class="remote-chip" id="remote-chip" hidden>
      <span class="remote-text" id="remote-text"></span>
      <button class="remote-retry" id="remote-retry" hidden>重试</button>
    </div>
    <div class="proxy-chip" id="proxy-chip" hidden>
      <span class="remote-text" id="proxy-text"></span>
      <button class="remote-retry" id="proxy-retry" hidden>重试</button>
    </div>
  </div>
  <script>
    const tabs = document.querySelectorAll(".tab");
    function setActive(tab) {
      tabs.forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
    }
    tabs.forEach(t => t.addEventListener("click", () => {
      setActive(t.dataset.tab);
      window.__TAURI__.core.invoke("switch_tab", { tab: t.dataset.tab }).catch(() => {});
    }));
    // Rust 侧强制切卡（如本地服务出错）时同步高亮
    window.__TAURI__.event.listen("tab-changed", e => setActive(e.payload));
    // Rust 侧页面主题采样结果：精确覆盖 prefers-color-scheme 兜底
    window.__TAURI__.event.listen("theme-changed", e => {
      document.documentElement.dataset.theme = e.payload;
    });

    // 「远端」选项卡按设置显隐：初始拉取一次，之后跟随设置变更
    const remoteTab = document.querySelector('.tab[data-tab="remote"]');
    function applySettings(s) {
      if (s) remoteTab.hidden = s.show_remote_tab === false;
    }
    window.__TAURI__.event.listen("settings-changed", e => applySettings(e.payload));
    window.__TAURI__.core.invoke("get_settings").then(applySettings).catch(() => {});

    // 远程控制状态：连接中/失败时显示提示；失败附原因（hover）与重试按钮
    const remoteChip = document.getElementById("remote-chip");
    const remoteText = document.getElementById("remote-text");
    const remoteRetry = document.getElementById("remote-retry");
    function renderRemote(status) {
      const state = status && status.state;
      if (state === "failed") {
        remoteChip.hidden = false;
        remoteChip.classList.remove("connecting");
        remoteChip.classList.add("failed");
        remoteText.textContent = "远程控制未连接";
        remoteChip.title = status.reason ? String(status.reason).slice(0, 120) : "";
        remoteRetry.hidden = false;
      } else if (state === "connecting") {
        remoteChip.hidden = false;
        remoteChip.classList.remove("failed");
        remoteChip.classList.add("connecting");
        remoteText.textContent = "远程控制连接中…";
        remoteChip.title = "";
        remoteRetry.hidden = true;
      } else {
        remoteChip.hidden = true;
        remoteChip.classList.remove("connecting", "failed");
        remoteChip.title = "";
        remoteRetry.hidden = true;
      }
    }
    // 先注册监听再同步查询：避免两者之间产生的状态事件丢失
    window.__TAURI__.event.listen("remote-status", e => renderRemote(e.payload));
    window.__TAURI__.core.invoke("remote_status").then(renderRemote).catch(() => {});
    remoteRetry.addEventListener("click", () => {
      window.__TAURI__.core.invoke("retry_remote").catch(() => {});
    });

    // OpenCode 代理状态：启动失败（端口被占用/二进制缺失/未就绪）时显示原因与重试
    const proxyChip = document.getElementById("proxy-chip");
    const proxyText = document.getElementById("proxy-text");
    const proxyRetry = document.getElementById("proxy-retry");
    function renderProxy(status) {
      if (status && status.failed) {
        proxyChip.hidden = false;
        proxyChip.classList.add("failed");
        proxyText.textContent = "OpenCode 代理未启动";
        proxyChip.title = status.reason ? String(status.reason).slice(0, 120) : "";
        proxyRetry.hidden = false;
      } else {
        proxyChip.hidden = true;
        proxyChip.classList.remove("failed");
        proxyChip.title = "";
        proxyRetry.hidden = true;
      }
    }
    window.__TAURI__.event.listen("proxy-status", e => renderProxy(e.payload));
    window.__TAURI__.core.invoke("proxy_status").then(renderProxy).catch(() => {});
    proxyRetry.addEventListener("click", () => {
      window.__TAURI__.core.invoke("retry_proxy").catch(() => {});
    });
  </script>
</body>
</html>
